name: publish

# Publishes nano-triton to PyPI via Trusted Publishing (OIDC): no API token,
# no stored secret. Runs when a GitHub Release is published, or on manual
# dispatch. PyPI must have a Trusted Publisher configured for this repo +
# workflow (see the repo notes / PyPI "Publishing" settings).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
